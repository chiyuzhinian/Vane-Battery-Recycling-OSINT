          - main [ref=e106]:
            - article [ref=e110]:
              - generic [ref=e111]:
                - heading "Transporting Lithium Batteries" [level=1] [ref=e112]
                - generic [ref=e113]:
                  - paragraph [ref=e114]:
                    - img "Lithium Battery image" [ref=e115]
                  - paragraph [ref=e116]: Lithium cells and batteries power countless items that support everyday life from portable computers, cordless tools, mobile telephones, watches, to wheelchairs and motor vehicles. Our society has come to depend on lithium cells and batteries for an increasingly mobile lifestyle. Today's lithium cells and batteries are more energy dense than ever, bringing a steadily growing number of higher-powered devices to market. With the increased energy density comes greater risk and the need to manage it. Shippers play an important role in reducing this risk and preventing incidents—including fires aboard aircraft or other transport vehicles.
                  - paragraph [ref=e117]: Lithium batteries are regulated as a hazardous material under the U.S. Department of Transportation's (DOT) Hazardous Materials Regulations (HMR; 49 C.F.R., Parts 171-180). The HMR apply to any material DOT determines can pose an unreasonable risk to health, safety, and property when transported in commerce. Lithium batteries must conform to all applicable HMR requirements when offered for transportation or transported by air, highway, rail, or water.
                  - heading [level=3] [ref=e118]:
                    - strong [ref=e119]: Why are Lithium Batteries Regulated in Transportation?
                  - paragraph [ref=e120]: The risks posed by lithium cells and batteries are generally a function of type, size, and chemistry. Lithium cells and batteries can present both chemical (e.g., corrosive or flammable electrolytes) and electrical hazards. Unlike standard alkaline batteries, most lithium batteries manufactured today contain a flammable electrolyte and have an incredibly high energy density. They can overheat and ignite under certain conditions, such as a short circuit, physical damage, improper design, or assembly. Once ignited, lithium cell and battery fires can be difficult to extinguish. Additional, although infrequent, events can result in lithium cells and batteries experiencing thermal runaway, a chain reaction leading to a violent release of stored energy and flammable gas. This thermal runaway can propagate to other batteries or combustible materials nearby, potentially resulting in large scale thermal events with severe consequences.
