  # ---------- 州级（美国电池 EPR 的实际立法层级）----------
  #
  # ⚠️ 美国**没有联邦电池 EPR 法**，生产者责任立法全部发生在州级。
  #    这一层是本项目最薄的一环，下面是 2026-09-11 摸底后的实测结论。
  #
  # 三条方法结论（每条都有代价）：
  #   ① **不要猜 URL** —— 一次性猜了 14 个州的深链，**全错**
  #      （404 / 403 / 连不上 / 200 但只有 212 字节空壳）。
  #      正解是用**站点自己的导航或 sitemap**：
  #        · CalRecycle  ：浏览器从 `/` 下钻 → `/epr/` → `/EPR/batteries/`
  #        · Minnesota   ：`sitemap.xml`（1828 条）里筛出 `rechargeable-batteries`
  #        ⚠️ 顺带发现：之前猜的 MN 页 `/business-with-us/batteries` 是 404，
  #           真 slug 是 `rechargeable-batteries`。
