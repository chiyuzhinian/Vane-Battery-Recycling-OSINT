    - id: eu_echa_batteries
      name: ECHA - 电池法规相关（化学品与危废定性）
      url: https://echa.europa.eu/understanding-batteries-regulation
      verified: true                  # ✅ 完全可达（实测 7/7 相关）
      direct_blocked: true            # ⚠️ httpx/curl 403；且状态码仍是 403
      channel: browser_capture
      requires_js_challenge: true     # ⭐ 需等待 JS 人机验证（约 6-9 秒）
      tier: official
      base_credibility: 95
      clusters: [C3_black_mass]
      check_frequency: weekly
      key_assets:
        - name: 电池法规物质限制数据库（附件 I + 第 13(5) 条 + 附件 VI）
          url: "https://echa.europa.eu/eu-batteries_regulation-anx_i_vi_art_13_5"
          note: |
            22.5 万字符的 EUCLef 立法清单：汞/镉/铅使用禁令 + 标签要求
            （含 CLP 法规附录 VI 表 3 的危险物质非穷尽清单）。
            ⭐ 这是黑粉成分定性的直接依据，已全文落盘。
        - name: ECHA 在电池法规下的职责
          url: "https://echa.europa.eu/echas-activities-under-batteries-regulation"
      note: |
        ⭐⭐ 重大误判纠正（2026-09-11）：
        此前把 ECHA 记为「403 反爬 / 需浏览器接管」，**这是错的**。
        真相：ECHA 的 Azure WAF 返回的是 **JS 人机验证挑战页**
        （"One moment, we're checking you're not a bot."），
        **挑战跑完约 6-9 秒后页面正常加载**。
        首版浏览器层只等 1.2 秒取正文 → 拿到的就是挑战页 → 误判为整站封锁。

        教训：**403 不等于硬拦截**。
          · 挑战页与真拒绝页的 HTTP 状态码都是 403，但前者会给内容
          · 判定一个源失效之前，必须给它通过挑战的时间
          · 同理，403 与 404 必须分清：`/regulations/batteries-regulation`
            一直是 **404 死链**，也曾被当成"反爬"浪费调查方向

        已实现的机制：`BrowserFetcher._await_challenge()`
          · 检测 CHALLENGE_MARKERS（Azure WAF / just a moment / captcha …）
          · 命中则轮询等待至多 challenge_ms（默认 20s）
          · 入库门禁改判「有没有拿到实质内容」而非「状态码好不好看」
          · 单测 `py tests/test_browser_challenge.py` → 10/10

