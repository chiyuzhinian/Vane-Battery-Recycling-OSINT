version: 1
plan_id: SE_PLAN_V1
jurisdiction: SE
scope: SE

source_roles:
  - {role: SE_NATIONAL_LEGISLATION, critical: true}

source_endpoints:
  - se_sfst_search
  - se_sfst_doc

critical_sources:
  - se_sfst

query_taxonomy_version: qt-v1
query_set:
  fr_agencies: []                      # A 无种子（SE 走 B/C）
  fr_terms:                            # B：母语检索词（瑞典语，单词形式）
