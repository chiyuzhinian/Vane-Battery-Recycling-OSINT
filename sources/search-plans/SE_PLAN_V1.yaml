    # batteri→22 docs ｜ batterier→30 docs ｜ batteriavfall→2 docs
    - batteri
    - batterier
    - batteriavfall
  eu_keywords:                         # C：显式引用种子（SFS 文号）
    - "SFS 2008:834"
    - "SFS 2007:185"
    - "SFS 2020:614"
    - "SFS 2025:1071"
    - "SFS 2025:813"
  cross_terms: []                      # D：无缺口种子

language_set: [sv]
time_window: {from: "2018-01-01", to: "2026-12-31"}
year_segments: []

discovery_routes: [B, C]
acceptance_rule_version: "1"
dedupe_rule_version: "v1"

notes: >-
  Pilot（优先度 0.790）。B 路线经 Step 8 探针验证（fritext 检索 22 hits 可解析：
  search-hit 块含标题 + SFS-nummer）；C 种子含 B 探针实见的两部 2025 年电池互补条例。
