source_endpoints:
  - us_wa_rcw_doc
  - us_wa_rcw_chapter

critical_sources:
  - us_wa_rcw

query_taxonomy_version: qt-v1
query_set:
  fr_agencies:                         # A：RCW section 直链种子
    - "70A.200.010"
    - "70A.200.020"
    - "70A.200.030"
    - "70A.200.040"
    - "70A.200.050"
    - "70A.555.010"
    - "70A.555.020"
  fr_terms:                            # B 不可用（search.do 404）→ 供章目录过滤
