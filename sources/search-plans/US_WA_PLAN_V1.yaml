#          ｜ cross_terms→D 缺口种子 ｜ year_segments→B 年份过滤
# 纪律：自冻结起不得修改；搜索空间变化 → US_WA_PLAN_V2（reset）
# ============================================================
version: 1
plan_id: US_WA_PLAN_V1
jurisdiction: US-WA
scope: US-WA

