notes: >-
  Pilot（优先度 0.575；70A.555 电池管理专章已 Source Proof）。RCW 无检索端点
  （Step 8 探测 search.do 404）→ B 路线不可用（如实）；A 走 section 直链种子 +
  章目录（cite=70A.200 下 40 条章节链接）标题过滤，C 从语料正文抽 "RCW 70A.NNN.NNN"
  引用回采。
