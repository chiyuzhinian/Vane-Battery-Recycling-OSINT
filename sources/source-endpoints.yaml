# ============================================================
# Source Endpoints Registry —— Source Role × 官方端点
# ------------------------------------------------------------
# 归属：Phase 4B-1 Step 1 ｜ 运行时：app/policy/config.py::load_endpoints()
#                                              app/policy/source_probe.py（探测）
#                                              scripts/audit_source_roles.py（矩阵）
# ------------------------------------------------------------
# 核心模型（用户口径 2026-09-12 修正）：
#   1) endpoint_status ≠ source role status
#      「一个入口坏了 ≠ 整个官方源不可用」
#      → 角色状态由**全部可用端点**综合判定（见 source_access.derive_role_status）
#   2) HTTP 403 / 500 ≠ paywalled_known
#      只有明确付费机制证据才可记 PAYWALL_CONFIRMED；
#      ISO 403 只能记 endpoint_status=BLOCKED + failure_type=HTTP_403
#   3) Standards 五概念分离：
#      metadata_available / fulltext_available / open_access_status
#      / metadata_source_type / endpoint_status
#      · EU OJ/JRC 引用 → metadata_source_type=EU_OFFICIAL_REFERENCE
#        只能证明「被官方引用」，**不得**标记角色 COMPLETE（status_ceiling: PARTIAL）
# ============================================================
version: 1

defaults:
  timeout_s: 25
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
  parsers: [html, json, xml]        # 可解析的内容类型（pdf 未启用 → UNSUPPORTED_FORMAT）

roles:

  # ---------------------------------------------------------- EU 超国家
  - role: EU_OFFICIAL_JOURNAL
    jurisdiction: EU
    source_name: "EU Official Journal (via EUR-Lex)"
    official_domain: eur-lex.europa.eu
    notes: "OJ 与 EUR-Lex 同库；经 CELEX 覆盖，无需独立连接器"
    endpoints:
      - id: eurlex_home
        official_url: "https://eur-lex.europa.eu/homepage.html"
        official_domain: eur-lex.europa.eu
        content_kind: html
        role_method: page
        capabilities: {enumeration: false, metadata: true, fulltext: true}
        notes: "OJ 电子版与 EUR-Lex 同库（CELEX 可检索 OJ 系列）"

  - role: EURLEX_PRIMARY
    jurisdiction: EU
    source_name: "EUR-Lex 主库"
    official_domain: eur-lex.europa.eu
    endpoints:
