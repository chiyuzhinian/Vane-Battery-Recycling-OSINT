        official_url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32023R1542"
        official_domain: eur-lex.europa.eu
        content_kind: html
        role_method: page
        capabilities: {enumeration: true, metadata: true, fulltext: true}
        notes: "电池法本体页（锚点判定的基准样本）"
      - id: cellar_sparql
        official_url: "https://publications.europa.eu/webapi/rdf/sparql?query=ASK%7B%3Fs%20%3Fp%20%3Fo%7D&format=application%2Fsparql-results%2Bjson"
        official_domain: publications.europa.eu
        content_kind: json
        role_method: sparql
        capabilities: {enumeration: true, metadata: true, fulltext: false}
        probe: {kind: json_api, expect_keys: [head, boolean]}
        notes: "Cellar 官方关系图谱（家族扩张/修订废除关系的官方证据源）"

