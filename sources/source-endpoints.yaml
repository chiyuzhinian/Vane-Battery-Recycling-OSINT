  - role: STANDARDS
    jurisdiction: EU
    source_name: "标准层（CEN/ISO 元数据 + EU 官方引用）"
    status_ceiling: PARTIAL          # ★ 用户裁定：EU 官方引用 ≠ 标准库接入完成
    notes: >
      全文不可得时不得生成条款级证据；EU OJ/JRC 引用只能证明「被官方引用/关联」。
      open_access_status 四值：open_fulltext / official_metadata_only /
      paywalled_known / unavailable —— HTTP 403/500 不得推断 paywalled。
    endpoints:
      - id: cencenelec_home
        official_url: "https://www.cencenelec.eu/"
        official_domain: cencenelec.eu
        content_kind: html
        role_method: page
        metadata_source_type: OFFICIAL_PUBLISHER
        capabilities: {enumeration: true, metadata: true, fulltext: false}
        notes: "CEN/CENELEC 主站（元数据层）；标准全文多为付费"
      - id: cencenelec_standards_portal
        official_url: "https://standards.cencenelec.eu/"
        official_domain: standards.cencenelec.eu
        content_kind: html
        role_method: page
        metadata_source_type: OFFICIAL_PUBLISHER
        capabilities: {enumeration: true, metadata: true, fulltext: false}
        probe: {kind: html_page, detect_spa: true}
        notes: "Oracle APEX + JS 重定向（SPA）；深层 f?p= 页面历史上 500"
      - id: iso_catalogue
        official_url: "https://www.iso.org/standards.html"
        official_domain: iso.org
        content_kind: html
        role_method: page
        metadata_source_type: OFFICIAL_PUBLISHER
        capabilities: {enumeration: true, metadata: true, fulltext: false}
        notes: "ISO 目录（bot 防护；403 记 HTTP_403，不得推断付费墙）"
      - id: eu_harmonised_standards_ref
