# ============================================================
# Jurisdiction Source Universe —— 管辖区 × 源角色 覆盖注册表
# ------------------------------------------------------------
# 归属：Phase 4A ｜ 运行时：app/policy/source_universe.py
# 核心原则：**"URL 存在" ≠ source coverage complete**
#   每个管辖区必须逐 **Source Role** 回答：
#     expected / configured / reachable / collector_available
#     / last_verified / status / gap_reason
# 状态机：NOT_ONBOARDED → DISCOVERED → ACCESSIBLE → CONNECTED
#         → PARTIAL → COMPLETE ｜ BLOCKED
# ============================================================
version: 1

# ------------------------------------------------------------
# 一、欧盟（超国家）
# ------------------------------------------------------------
jurisdictions:

  - code: EU
    name_zh: 欧盟
    level: supranational
    source_roles:
      - role: EU_OFFICIAL_JOURNAL
        critical: true
        expected: true
        sources: [eu_eurlex_battery_reg]      # 经 EUR-Lex 间接覆盖（OJ 同库）
        status: CONNECTED
        note: OJ 与 EUR-Lex 同源；无需独立连接器
      - role: EURLEX_PRIMARY
        critical: true
        expected: true
        sources: [eu_eurlex_battery_reg]
        status: COMPLETE
        note: ~46 部核心法案精确跟踪 + 锚点发现闭环
      - role: EURLEX_DELEGATED_IMPLEMENTING
        critical: true
        expected: true
        sources: [eu_eurlex_battery_reg]
        status: CONNECTED
        note: supplementing/implementing 判定 0e + 锚点扫描覆盖
      - role: EURLEX_NIM
        expected: true
        sources: [eu_nim]
        status: CONNECTED
        note: NIM 索引 27 国 566 条→396 落盘；⚠️ NIM ≠ 成员国法律全集（见 SG 检查）
      - role: MEMBER_STATE_LEGISLATION
        expected: true
        sources: [de_gesetze, nl_bwb, es_boe, fr_dila, eu_nim]
        status: PARTIAL
        note: 专线 4 国（DE/NL/ES/FR）+ NIM 全 27 国索引
      - role: MEMBER_STATE_OFFICIAL_GAZETTE
        expected: true
        sources: [nl_bwb, es_boe, fr_dila]
        status: PARTIAL
        note: 德/荷/西/法有公报渠道；其余 23 国仅 NIM 元数据（含公报引用）
      - role: ENVIRONMENT_AGENCY
        critical: true
        expected: true
        sources: [browser_echa]
        status: PARTIAL
        note: ECHA 浏览器层；各国环保署未逐一接入
      - role: TRANSPORT_AUTHORITY
        expected: false
        sources: []
        status: NOT_ONBOARDED
        gap_reason: 欧盟层面由成员国主管（运输规则在 EU 由 WSR/ADR 覆盖）
      - role: CUSTOMS_TRADE
        critical: true
        expected: true
        sources: [eu_eurlex_waste_shipment]
        status: CONNECTED
        note: WSR 2024/1157 家族=黑粉跨境载体；TARIC 未单独接入
      - role: STANDARDS
        critical: true
        expected: true
        sources: [int_standards_ref]
        status: CONNECTED
        note: "EU 官方引用（OJ/JRC metadata，open_access_status=official_metadata_only）；CEN/ISO 直连为 SPA/bot 拦截 → 角色 ceiling=PARTIAL"
      - role: BASEL
        critical: true
        expected: true
        sources: [int_basel]
        status: CONNECTED
        note: "技术导则/出版物页（服务端渲染）+ 官方 PDF（仅元数据）；draft ≠ binding（测试锁定）"
      - role: OECD
        critical: true
        expected: true
        sources: []
        status: PARTIAL
        note: "2026-09-12 实测：legalinstruments 为 JS 渲染 SPA（HTTP 200 但无静态内容）；主站 403 → 需浏览器通道/官方 API（role=PARTIAL，非 BLOCKED）"

