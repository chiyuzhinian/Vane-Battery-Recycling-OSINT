# ============================================================
# Jurisdiction Onboarding Contract —— US-MN（Pilot，Step 4b）
# Source Proof：outputs/audit/source_proofs/US-MN.json
# ============================================================
version: 1
jurisdiction_id: US-MN
jurisdiction_name: {zh: 明尼苏达, en: Minnesota}
level: state
official_languages: [en]
legal_system_type: common_law

mandatory_source_roles:
  - STATE_LEGISLATURE
  - STATE_STATUTES
  - STATE_ADMIN_CODE
  - STATE_REGISTER
  - STATE_ENVIRONMENT_AGENCY
  - STATE_WASTE_PROGRAM
  - STATE_BATTERY_EPR_OR_STEWARDSHIP
  - STATE_TRANSPORT_HAZMAT
optional_source_roles: [STATE_TAX_INCENTIVES, STATE_RECYCLING_PROGRAM]

official_channel_map:
  STATE_STATUTES:
    - source_id: us_mn_revisor
      official_url: "https://www.revisor.mn.gov/"
      access_method: html
      status: ACCESSIBLE
      note: "入口可达；检索/法规页提取未过主题核验（如实记录）→ Step 5 适配 revisor 检索参数"

known_gaps:
  STATE_LEGISLATURE: "MN legislature bill 通道未接入"
  STATE_ADMIN_CODE: "Minnesota Rules 通道未接入"
  STATE_REGISTER: "State Register 通道未接入"
  STATE_ENVIRONMENT_AGENCY: "MPCA 通道可达未接入（Step 5）"
  STATE_WASTE_PROGRAM: "废物项目通道未接入"
  STATE_BATTERY_EPR_OR_STEWARDSHIP: "电池 EPR 立法文档未采集（已知立法信号，待 Step 5 定位）"
  STATE_TRANSPORT_HAZMAT: "危货运输通道未接入"

collector_strategy:
  STATE_STATUTES: connector_pending（revisor 检索适配）
  STATE_LEGISLATURE: pending_probe
  STATE_ADMIN_CODE: pending_probe
  STATE_REGISTER: pending_probe
  STATE_ENVIRONMENT_AGENCY: pending_probe（MPCA 可达）
  STATE_WASTE_PROGRAM: pending_probe
  STATE_BATTERY_EPR_OR_STEWARDSHIP: pending_probe
  STATE_TRANSPORT_HAZMAT: pending_probe
identity_strategy:
  pattern: "US-MN:Stat.{chapter}.{section}"
  enrich_fields: [title, effective_date, session_law]
status_strategy: "官方 statute 元数据"
legal_relation_strategy: "bill → session law → statutes（州法修订链）"
notes: "Pilot（优先度 0.585；电池 EPR 法州 + MPCA 可达）。"
