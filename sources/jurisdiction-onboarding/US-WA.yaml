# ============================================================
# Jurisdiction Onboarding Contract —— US-WA（Pilot，Step 4b）
# Source Proof：outputs/audit/source_proofs/US-WA.json
# ============================================================
version: 1
jurisdiction_id: US-WA
jurisdiction_name: {zh: 华盛顿州, en: Washington}
level: state
official_languages: [en]
legal_system_type: common_law

mandatory_source_roles:
  - STATE_LEGISLATURE
  - STATE_STATUTES
  - STATE_ADMIN_CODE
  - STATE_REGISTER
  - STATE_ENVIRONMENT_AGENCY
  - STATE_WASTE_PROGRAM
  - STATE_BATTERY_EPR_OR_STEWARDSHIP
  - STATE_TRANSPORT_HAZMAT
optional_source_roles: [STATE_TAX_INCENTIVES, STATE_RECYCLING_PROGRAM]

official_channel_map:
  STATE_STATUTES:
    - source_id: us_wa_rcw
      official_url: "https://app.leg.wa.gov/rcw/"
      access_method: html
      status: CONNECTED
      note: "Step 8 回填：连接器真实采集（章节直链）；R1-R4 引用链扩张 14 篇"
  STATE_BATTERY_EPR_OR_STEWARDSHIP:
    - source_id: us_wa_rcw
      official_url: "https://app.leg.wa.gov/RCW/default.aspx?cite=70A.555"
      access_method: html
      status: CONNECTED
      note: "Step 8 回填：70A.555 专章 + 14 篇 section 级入库；检索端点缺失（如实）"
  STATE_ADMIN_CODE:
    - source_id: us_wa_wac
      official_url: "https://app.leg.wa.gov/WAC/"
      access_method: html
      status: CONNECTED
      note: "Step 6 角色 closure：WAC cite 直链连接器（173-303 危废章等，样本 3/3 已入库）"
  STATE_ENVIRONMENT_AGENCY:
    - source_id: us_wa_ecology
      official_url: "https://ecology.wa.gov/"
      access_method: html
      status: CONNECTED
      note: "Step 6 角色 closure：Ecology Waste & Toxics 频道连接器（3 页 B 级入库）"
  STATE_WASTE_PROGRAM:
    - source_id: us_wa_ecology
      official_url: "https://ecology.wa.gov/Waste-Toxics"
      access_method: html
      status: CONNECTED
      note: "同 Ecology 官方通道（废物/回收项目主管机构）"
  STATE_LEGISLATURE:
    - source_id: us_wa_bills
      official_url: "https://app.leg.wa.gov/billsummary"
      access_method: html
      status: CONNECTED
      note: "Step 6 角色 closure：billsummary 直链（SB 5144 (2023) 电池管理法已验证入库）"

known_gaps:
  STATE_REGISTER: "州公报通道未接入"
  STATE_TRANSPORT_HAZMAT: "危货运输通道未接入"

collector_strategy:
  STATE_STATUTES: connector_pending（RCW 直链）
  STATE_LEGISLATURE: pending_probe
  STATE_ADMIN_CODE: pending_probe
  STATE_REGISTER: pending_probe
  STATE_ENVIRONMENT_AGENCY: pending_probe（Ecology 可达）
  STATE_WASTE_PROGRAM: pending_probe
  STATE_BATTERY_EPR_OR_STEWARDSHIP: connector_pending（70A.555）
  STATE_TRANSPORT_HAZMAT: pending_probe
identity_strategy:
  pattern: "US-WA:RCW:{chapter}.{section}"
  enrich_fields: [title, session_law, effective_date]
status_strategy: "RCW 元数据"
legal_relation_strategy: "bill → session law → RCW（州法修订链）"
notes: "Pilot（优先度 0.575；政策活跃 + RCW/Ecology 双通道）。"
