# ============================================================
# Jurisdiction Onboarding Contract —— SE（Pilot，Step 4a 追加）
# Source Proof：outputs/audit/source_proofs/SE.json（2026-09-13）
# ============================================================
version: 1
jurisdiction_id: SE
jurisdiction_name: {zh: 瑞典, en: Sweden}
level: member_state
official_languages: [sv]
legal_system_type: civil_law

mandatory_source_roles:
  - MS_LEGISLATION_DATABASE
  - MS_OFFICIAL_GAZETTE
  - MS_ENVIRONMENT_MINISTRY_OR_AGENCY
  - MS_WASTE_REGULATOR
  - MS_TRANSPORT_OR_DANGEROUS_GOODS
  - MS_CUSTOMS_OR_TRADE
  - MS_STANDARDS_METADATA
optional_source_roles: [MS_EPR_AUTHORITY, MS_ELV_AUTHORITY]

official_channel_map:
  MS_LEGISLATION_DATABASE:
    - source_id: se_sfst
      official_url: "https://rkrattsbaser.gov.se/"
      access_method: html
      status: CONNECTED
      note: "Step 8 回填：直链+检索（fritext）连接器真实采集；R1-R3 三轮发现 7 篇"
  MS_OFFICIAL_GAZETTE:
    - source_id: se_sfst
      official_url: "https://rkrattsbaser.gov.se/sfst"
      access_method: html
      status: CONNECTED
      note: "Step 6 角色 closure：SFS = 瑞典官方公报（Svensk författningssamling），SFST 即公报发布系统——法源与公报同一通道（官方事实）"
    - source_id: eu_nim_se
      official_url: "https://eur-lex.europa.eu/legal-content/EN/NIM/?uri=CELEX:32023R1542"
      access_method: nim_index
      status: DISCOVERED
      discovery_layer_only: true
      note: "NIM 公报引用线索（15 条）；SFST 亦承载公报职能"
  MS_ENVIRONMENT_MINISTRY_OR_AGENCY:
    - source_id: se_naturvardsverket
      official_url: "https://www.naturvardsverket.se/"
      access_method: html
      status: PARTIAL
      note: "Step 6 探测：主站可达（avfall 主题页）但**正文客户端渲染**（静态仅 ~5K 残文）→ PARTIAL；浏览器/官方接口候选"
  MS_TRANSPORT_OR_DANGEROUS_GOODS:
    - source_id: se_transportstyrelsen
      official_url: "https://www.transportstyrelsen.se/sv/Regler/"
      access_method: html
      status: CONNECTED
      note: >-
        2B1：Transportstyrelsen（瑞典交通署）——Regler 法规索引 +
        farligt gods 搜索（服务端渲染实证，可重复 httpx 采集）；
        样本已入库（se_transportstyrelsen_regler / _farligt_gods）。
  MS_STANDARDS_METADATA:
    - source_id: se_sis
      official_url: "https://www.sis.se/sok/"
      access_method: html
      status: PARTIAL
      note: >-
        2B1：SIS（瑞典标准协会）标准目录/检索 metadata 可达
        （metadata-only 口径；标准全文付费——PAYWALLED_KNOWN）。
        样本：se_sis_standarder。

known_gaps:
  MS_WASTE_REGULATOR: "废物监管通道未接入（NV 正文渲染受限；Länsstyrelsen 待探）"
  MS_CUSTOMS_OR_TRADE: "Tullverket 403（Cloudflare 壳，待网络环境/官方接口）"

collector_strategy:
  MS_LEGISLATION_DATABASE: connector（HTML 解析，Step 5）
  MS_OFFICIAL_GAZETTE: nim_discovery
  MS_ENVIRONMENT_MINISTRY_OR_AGENCY: pending_probe
  MS_WASTE_REGULATOR: pending_probe
  MS_TRANSPORT_OR_DANGEROUS_GOODS: connector（Transportstyrelsen，2B1）
  MS_CUSTOMS_OR_TRADE: pending_probe
  MS_STANDARDS_METADATA: metadata_only（SIS，2B1）
identity_strategy:
  pattern: "SE:SFS:{year}:{number}"
  enrich_fields: [title, publish_date, official_url]
status_strategy: "SFST 页面元数据（ändringsförfattning 标注）"
legal_relation_strategy: "nim_transposition"
notes: "Pilot（优先度 0.790）。"
