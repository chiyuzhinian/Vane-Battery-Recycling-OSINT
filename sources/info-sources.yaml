# ============================================================
# 三、启用流程（每个源走完这 4 步才进入正式采集）
# ============================================================
activation_workflow:
  - step: 1
    action: 用 discover_via 查询串做一次检索
    tool: "Vane /api/search"
  - step: 2
    action: 人工确认官网域名（防仿冒站）
    owner: chiyuzhinian
  - step: 3
    action: 回填 homepage/domain，并把 verified 改为 true
  - step: 4
    action: 探测可达性与更新频率，决定 connector / RSS / 搜索兜底

# ---------- 与 03 篇可信度分层的对应关系 ----------
