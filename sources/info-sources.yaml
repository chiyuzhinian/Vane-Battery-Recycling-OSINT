# ============================================================
# 行业信息源注册表（咨询机构 + 协会组织）
# ------------------------------------------------------------
# 归属：Vane-Battery-Recycling-OSINT / sources
# 更新：2026-09-10
# ------------------------------------------------------------
# 【为什么单独成文件？】
# 你给的名单里，这三类东西的**用法完全不同**，混在一起会污染企业库：
#   · 咨询机构 → 是"信息源"（产出行业数据、价格、研究报告），应对应 03 篇的
#                「行业权威数据源」「参考性数据源」两层，而不是"采集对象"
#   · 协会组织 → 是"信息源"（产出标准、白皮书、行业运行数据、政策建议稿）
#   · 同行企业 → 才是"采集对象"，已单独放入 sources/companies.yaml
#
# 【homepage 为空的原因】
# 未经核实的 URL 一律不写死，避免采集时打到仿冒站/过期域名。
# 这些源先以 `discover_via` 查询串进入"新源发现"流程：
#   1) 用查询串检索 → 2) 人工确认官网 → 3) 回填 homepage/domain → 4) 转 verified
# 对应 04 篇 §3.2 规律发现引擎的 P1（新兴高效源）机制。
# ============================================================

version: 1
updated_at: 2026-09-10
meta:
  advisory_count: 13        # 咨询机构（原始 13 项）
  association_count: 17     # 协会组织（原始 15 项，CABIA 重复去掉 1 项 → 14；
                            #   其中"中国物资再生协会"拆出 4 个子机构、"中国工业节能与清洁生产协会"
                            #   拆出 1 个专委会，故实际登记 17 条）
  total: 30

defaults:
  source_type: industry_db
  enabled: true
  verified: false           # 全部先置 false，人工确认官网后再改
  connector: null
  fallback: vane_search
  check_frequency: weekly
  vane_mode: balanced

