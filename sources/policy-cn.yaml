# ============================================================
# 采集规则
# ============================================================
collection_rules:
  dedup: true
  cross_validate: true
  translate_to_zh: false          # 中文源无需翻译
  min_quality_to_ingest: 60
  vane_mode: quality
  vane_sources: [web]

  # 同一政策被多站转载 → 以权威度最高的那条为主，其余作为交叉验证证据
  repost_handling:
    primary_by_tier: true
    keep_others_as_evidence: true

event_types:
  - { id: opinion_draft,    zh: 征求意见稿 }        # ← 最具预警价值
  - { id: issued,           zh: 正式印发 }
  - { id: interpreted,      zh: 政策解读 }
  - { id: whitelist,        zh: 白名单/规范条件公示 }
  - { id: subsidy_notice,   zh: 补贴申报通知 }
  - { id: standard_draft,   zh: 标准征求意见 }
  - { id: standard_release, zh: 标准发布 }
  - { id: standard_impl,    zh: 标准实施 }
  - { id: inspection,       zh: 督察/执法通报 }
  - { id: tax_notice,       zh: 税收政策公告 }

# ============================================================
# 优先级依据（来自你提供的 85 条实测分布）
# ============================================================
priority_basis:
  total_observed: 85
  distribution:
    - { source: std.samr.gov.cn,      count: 45, share: 0.529, group: 标准源 }
    - { source: www.mee.gov.cn,       count: 14, share: 0.165, group: 部委源 }
    - { source: www.miit.gov.cn,      count: 8,  share: 0.094, group: 部委源 }
    - { source: wap.miit.gov.cn,      count: 3,  share: 0.035, group: 部委源 }
    - { source: xxgk.mot.gov.cn,      count: 2,  share: 0.024, group: 部委源 }
    - { source: www.samr.gov.cn,      count: 2,  share: 0.024, group: 部委源 }
    - { source: www.ndrc.gov.cn,      count: 2,  share: 0.024, group: 部委源 }
    - { source: app.www.gov.cn,       count: 1,  share: 0.012, group: 部委源 }
    - { source: gxj.gz.gov.cn,        count: 1,  share: 0.012, group: 地方源 }
    - { source: www.ttbz.org.cn,      count: 1,  share: 0.012, group: 标准源 }
    - { source: szs.mof.gov.cn,       count: 1,  share: 0.012, group: 部委源 }
    - { source: zhejiang.chinatax.gov.cn, count: 1, share: 0.012, group: 地方源 }
    - { source: jxj.beijing.gov.cn,   count: 1,  share: 0.012, group: 地方源 }
    - { source: jjxxw.cq.gov.cn,      count: 1,  share: 0.012, group: 地方源 }
    - { source: gxt.hunan.gov.cn,     count: 1,  share: 0.012, group: 地方源 }
    - { source: gxt.jl.gov.cn,        count: 1,  share: 0.012, group: 地方源 }

  group_summary:
    标准源: { sources: 2, count: 46, share: 0.541 }
    部委源: { sources: 9, count: 37, share: 0.435 }
    地方源: { sources: 5, count: 5,  share: 0.059 }

  takeaway: |
    ① 标准源占比过半 → 中国电池回收"政策"的主体是 GB/GB/T 与团体标准，
       采集重心必须放在 std.samr.gov.cn，而不是部委新闻。
    ② 部委源中 mee（16.5%）> miit（9.4%）→ 环保口比产业口信息更密。
    ③ 地方源分散（5 个源各 1 条）→ 说明地方政策尚未成为主线，
       但湖南/广东/浙江与目标企业地理重叠，值得按企业所在地扩面。

