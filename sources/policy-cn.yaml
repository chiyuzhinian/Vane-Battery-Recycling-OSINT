region: CN
enabled: true
status: pending_user_input
language_policy:
  fetch: [zh]
  store: [zh]

schedule: { day_of_week: 1, hour: 8, minute: 0 }   # 每周一 08:00

topics:
  - { id: national_policy,  zh: 国家层面政策,   keywords: [回收利用管理办法, 综合利用行业规范条件, 白名单, 试点] }
  - { id: subsidy,          zh: 补贴与激励,     keywords: [补贴, 税收优惠, 专项资金, 以旧换新] }
  - { id: standard,         zh: 标准与认证,     keywords: [GB, YS, 团体标准, 梯次利用, 溯源管理] }
  - { id: epr,              zh: 生产者责任延伸, keywords: [EPR, 生产者责任, 强制回收] }
  - { id: local_policy,     zh: 地方政策,       keywords: [省, 市, 产业园, 地方补贴] }
  - { id: supervision,      zh: 监管与执法,     keywords: [环保督察, 整治, 违规] }

