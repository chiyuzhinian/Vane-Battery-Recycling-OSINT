# ============================================================
# 中国（CN）动力电池回收政策数据源
# ------------------------------------------------------------
# 状态：✅ 已由用户提供真实来源清单（2026-09-10）
# 数据依据：用户在过往检索中实际命中的 85 条政策，来源分布见文末
# ------------------------------------------------------------
# ⚠️ 重要洞察：国家标准全文公开系统一家占 52.9%
#    → 中国"电池回收政策"的主体是【标准】(GB/T、GB)，
#      而不是部委红头文件。这直接改变采集优先级：
#      标准源 > 部委源 > 地方源
# ============================================================

region: CN
enabled: true
status: active
language_policy:
  fetch: [zh]
  store: [zh]

schedule: { day_of_week: 1, hour: 8, minute: 0 }   # 每周一 08:00

topics:
  - { id: national_policy, zh: 国家层面政策,   keywords: [回收利用管理办法, 综合利用行业规范条件, 白名单, 试点] }
  - { id: standard,        zh: 标准与认证,     keywords: [GB, GB/T, YS, 团体标准, 梯次利用, 溯源管理] }
  - { id: subsidy,         zh: 补贴与激励,     keywords: [补贴, 税收优惠, 专项资金, 以旧换新, 增值税] }
  - { id: epr,             zh: 生产者责任延伸, keywords: [EPR, 生产者责任, 强制回收, 回收目标责任制] }
  - { id: local_policy,    zh: 地方政策,       keywords: [省, 市, 产业园, 地方补贴, 实施方案] }
  - { id: supervision,     zh: 监管与执法,     keywords: [环保督察, 整治, 违规, 处罚] }
  - { id: transport,       zh: 运输与危废,     keywords: [危险货物, 运输管理, 跨省转移] }

# ============================================================
# 源清单：16 个（按实测命中占比排序）
# ============================================================
sources:

  # ---------- 🥇 一级：标准源（占比 54.1%，必须优先打通）----------
  - source_id: cn_std_samr
    name: 国家标准全文公开系统
    domain: std.samr.gov.cn
    entry: https://std.samr.gov.cn/
    source_type: standard
    tier: official
    base_credibility: 100
    priority: 1
    region: CN
    verified: false
    connector: null
    strategy: structured_portal       # 标准平台，优先找检索接口
    params:
      fallback: vane_search
      site_query: "site:std.samr.gov.cn 动力电池 回收"
      keywords: [动力电池回收, 退役电池, 梯次利用, 再生利用, 电池拆解]
      note: |
        实测占用户政策命中量的 52.9%（45/85 条）—— 单点最大的源。
        待办：探测其检索接口（GB 标准查询页面结构固定，值得写专用 Connector）。
    dimensions: [standard]
    observed_share: 0.529
    observed_count: 45
    check_frequency: weekly

  - source_id: cn_ttbz
    name: 全国团体标准信息平台
    domain: www.ttbz.org.cn
    entry: https://www.ttbz.org.cn/
    source_type: standard
    tier: official
    base_credibility: 95
    priority: 2
    region: CN
    verified: false
    connector: null
    strategy: site_search
    params:
      fallback: vane_search
      site_query: "site:ttbz.org.cn 电池 回收"
      note: 团体标准是国标空白的先行指标，往往比国标早 1-2 年反映行业实践
    dimensions: [standard]
    observed_share: 0.012
    observed_count: 1
    check_frequency: weekly

  # ---------- 🥈 二级：部委源（占比 43.5%）----------
