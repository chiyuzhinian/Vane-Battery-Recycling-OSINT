collection_rules:
  dedup: true
  cross_validate: true
  translate_to_zh: false          # 中文源无需翻译
  min_quality_to_ingest: 60
  vane_mode: quality
  vane_sources: [web]

event_types:
  - { id: opinion_draft,  zh: 征求意见稿 }        # ← 征求意见稿阶段最具预警价值
  - { id: issued,         zh: 正式印发 }
  - { id: interpreted,    zh: 政策解读 }
  - { id: whitelist,      zh: 白名单/规范条件公示 }
  - { id: subsidy_notice, zh: 补贴申报通知 }
  - { id: standard_release, zh: 标准发布 }
  - { id: inspection,     zh: 督察/执法通报 }

